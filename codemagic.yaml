# Codemagic native builds for Martie.
#
# The check workflows prove that the native iOS and Android projects still
# build. They use no signing or store credentials, and placeholder Firebase
# files (the real ones are not in the repository), so they run the same for
# forks. Lint, typecheck and tests stay in GitHub Actions (.github/workflows/ci.yml).
#
# The production workflows build signed store binaries on the Codemagic Mac
# with `eas build --local`, so signing credentials, version numbers, the
# Firebase files (base64) and the EXPO_PUBLIC_* values all stay in the EAS
# project and its `production` environment. They upload to TestFlight and the Play internal
# track as a draft (`eas submit --profile codemagic`) and never submit for
# review or roll out. They start only by hand and read only EXPO_TOKEN from the
# secure `martie_production` group.
#
# Every workflow runs on mac_mini_m2: the OpenIAP team plan offers no Linux
# instance, and the Mac image carries the Android SDK as well.
# Over-the-air updates ship with `bun ota:release` (Codemagic Patch).

definitions:
  environment: &environment
    node: 22.14.0
    vars:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      STAGE: development
      BUN_VERSION: '1.3.13'
  # Pull requests only: the team runs one build at a time, and a check on every
  # push to main would queue ahead of release builds (which build natively too).
  triggering: &triggering
    events:
      - pull_request
    branch_patterns:
      - pattern: main
        include: true
        source: false
    cancel_previous_builds: true
  scripts:
    - &install_bun
      name: Install Bun
      script: |
        curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
        echo "PATH=$HOME/.bun/bin:$PATH" >> "$CM_ENV"
    - &install_dependencies
      name: Install dependencies
      script: bun install --frozen-lockfile
    - &check_expo_token
      name: Check the EAS access
      script: |
        set -euo pipefail
        test -n "${EXPO_TOKEN:-}" || { echo "EXPO_TOKEN is missing from martie_production"; exit 1; }
        bunx eas-cli@23.0.0 whoami
    - &firebase_from_eas
      name: Write the Firebase config from EAS
      script: |
        set -euo pipefail
        # The real files are not in the repository; the EAS production
        # environment keeps them base64-encoded.
        bunx eas-cli@23.0.0 env:exec production --non-interactive \
          'printenv GOOGLE_SERVICES_JSON_BASE64 | base64 --decode > google-services.json &&
           printenv GOOGLE_SERVICE_INFO_PLIST_BASE64 | base64 --decode > GoogleService-Info.plist'
        test -s google-services.json
        test -s GoogleService-Info.plist
    - &check_release_tag
      name: Check the tag matches the app version
      script: |
        set -euo pipefail
        version=$(node -p 'require("./package.json").version')
        if [[ -n "${CM_TAG:-}" && "$CM_TAG" != "v$version" ]]; then
          echo "Tag $CM_TAG does not match package.json version $version"
          exit 1
        fi
        echo "Building $version"
    - &placeholder_firebase
      name: Write placeholder Firebase config
      script: |
        cat > GoogleService-Info.plist <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>API_KEY</key><string>placeholder</string>
          <key>BUNDLE_ID</key><string>dev.hyo.martie</string>
          <key>GCM_SENDER_ID</key><string>000000000000</string>
          <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          <key>PROJECT_ID</key><string>placeholder</string>
          <key>STORAGE_BUCKET</key><string>placeholder.appspot.com</string>
        </dict>
        </plist>
        PLIST
        cat > google-services.json <<'JSON'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "placeholder",
            "storage_bucket": "placeholder.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {"package_name": "dev.hyo.martie"}
              },
              "api_key": [{"current_key": "placeholder"}]
            }
          ],
          "configuration_version": "1"
        }
        JSON

  # Store builds start from a pushed `v<version>` tag (or by hand).
  release_triggering: &release_triggering
    events:
      - tag
    tag_patterns:
      - pattern: 'v*'
        include: true
  # YAML merge keys are shallow: each production workflow lists its own `vars`.
  production_environment: &production_environment
    node: 22.14.0
    groups:
      - martie_production

workflows:
  ios-simulator:
    name: iOS simulator build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *environment
      xcode: latest
      cocoapods: default
    triggering: *triggering
    scripts:
      - *install_bun
      - *install_dependencies
      - *placeholder_firebase
      - name: Generate the iOS project
        script: bunx expo prebuild --no-install --platform ios
      - name: Install pods
        script: cd ios && pod install
      - name: Build for the iOS simulator
        script: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Martie.xcworkspace \
            -scheme Martie \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty
    artifacts:
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app

  android-release:
    name: Android release build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *environment
      java: 17
    triggering: *triggering
    scripts:
      - *install_bun
      - *install_dependencies
      - *placeholder_firebase
      - name: Generate the Android project
        script: bunx expo prebuild --no-install --platform android
      - name: Build the release APK
        script: cd android && ./gradlew :app:assembleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-production:
    name: iOS production (TestFlight upload)
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering: *release_triggering
    environment:
      <<: *production_environment
      vars:
        CI: '1'
        EXPO_NO_DOTENV: '1'
        STAGE: production
        BUN_VERSION: '1.3.13'
      xcode: latest
      cocoapods: default
    scripts:
      - *install_bun
      - *install_dependencies
      - *check_release_tag
      - *check_expo_token
      - *firebase_from_eas
      - name: Build the signed IPA with EAS credentials
        script: |
          set -euo pipefail
          bunx eas-cli@23.0.0 build --platform ios --profile production \
            --local --non-interactive --output build/martie.ipa
      - name: Check the bundle carries the production backend
        script: |
          set -euo pipefail
          # grep -c reads to the end; grep -q would close the pipe early and
          # pipefail would turn the writer's SIGPIPE (141) into a failure.
          unzip -p build/martie.ipa 'Payload/*.app/main.jsbundle' \
            | grep -a -c martie-server.hyo.dev > /dev/null
          echo "main.jsbundle targets martie-server.hyo.dev"
      - name: Upload to TestFlight
        script: |
          bunx eas-cli@23.0.0 submit --platform ios --profile codemagic \
            --path build/martie.ipa --non-interactive
    artifacts:
      - build/*.ipa

  android-production:
    name: Android production (Play internal draft)
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering: *release_triggering
    environment:
      <<: *production_environment
      vars:
        CI: '1'
        EXPO_NO_DOTENV: '1'
        STAGE: production
        BUN_VERSION: '1.3.13'
        # Public SHA-256 of the Play upload certificate (EAS keystore). A
        # release signed with any other key fails here instead of at Play.
        UPLOAD_CERT_SHA256: '2B:56:EA:9E:00:25:2E:28:13:4C:51:0B:D6:1B:8F:D0:A9:1F:67:C9:2E:2C:79:C9:EE:6D:CB:CF:A8:28:EE:9F'
      java: 17
    scripts:
      - *install_bun
      - *install_dependencies
      - *check_release_tag
      - *check_expo_token
      - *firebase_from_eas
      - name: Build the signed app bundle with EAS credentials
        script: |
          set -euo pipefail
          bunx eas-cli@23.0.0 build --platform android --profile production \
            --local --non-interactive --output build/martie.aab
      - name: Check the signature and the production backend
        script: |
          set -euo pipefail
          aab=build/martie.aab
          # grep -c reads to the end; grep -q would close the pipe early and
          # pipefail would turn the writer's SIGPIPE (141) into a failure.
          keytool -printcert -jarfile "$aab" | grep -c "SHA256: $UPLOAD_CERT_SHA256" > /dev/null
          unzip -p "$aab" base/assets/index.android.bundle \
            | grep -a -c martie-server.hyo.dev > /dev/null
          echo "Signed with the upload key; bundle targets martie-server.hyo.dev"
      - name: Upload to the Play internal track as a draft
        script: |
          bunx eas-cli@23.0.0 submit --platform android --profile codemagic \
            --path build/martie.aab --non-interactive
    artifacts:
      - build/*.aab

  # Publishes a Codemagic Patch OTA to the Production deployment from a pushed
  # `ota-*` tag on a main commit. The tag message (or the commit subject) is
  # the release note. `cmpatch release-react` refuses a bundle whose native
  # fingerprint differs from the store binary, so native changes cannot ship
  # this way.
  ota-production:
    name: OTA production (Codemagic Patch)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      <<: *production_environment
      vars:
        CI: '1'
        EXPO_NO_DOTENV: '1'
        BUN_VERSION: '1.3.13'
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ota-*'
          include: true
    scripts:
      - *install_bun
      - *install_dependencies
      - *check_expo_token
      - *firebase_from_eas
      - name: Check the Patch access
        script: |
          set -euo pipefail
          test -n "${CODEMAGIC_PATCH_TOKEN:-}" || { echo "CODEMAGIC_PATCH_TOKEN is missing from martie_production"; exit 1; }
          bunx @codemagic/patch-cli@0.10.0 whoami --server-url https://ota.codemagicpatch.dev > /dev/null
          echo "Patch login works"
      - name: Publish the OTA update
        script: |
          set -euo pipefail
          git fetch --quiet --tags origin
          message=$(git tag -l --format='%(contents:subject)' "${CM_TAG:-}")
          [[ -n "$message" ]] || message=$(git log -1 --format=%s)
          OTA_CONFIRM_COMPATIBLE=1 OTA_MESSAGE="$message" scripts/ota-release.zsh all
