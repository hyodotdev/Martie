# Codemagic native builds for Martie.
#
# The check workflows prove that the native iOS and Android projects still
# build. They use no signing or store credentials, and placeholder Firebase
# files (the real ones are not in the repository), so they run the same for
# forks. Lint, typecheck and tests stay in GitHub Actions (.github/workflows/ci.yml).
#
# The production workflows build signed store binaries on the Codemagic Mac
# with `eas build --local`, so signing credentials, version numbers, the
# Firebase files (base64) and the EXPO_PUBLIC_* values all stay in the EAS
# project and its `production` environment. They upload to TestFlight and the Play internal
# track as a draft (`eas submit --profile codemagic`) and never submit for
# review or roll out. A `v*` tag starts them (the GitHub Release workflow pushes
# one after main's CI passes); they read EXPO_TOKEN from the secure
# `martie_production` group.
#
# When the Play upload succeeds, android-production starts amazon-production
# (Fire OS APK into an open Amazon Appstore edit), horizon-production (Meta
# Horizon Store upload, unreleased by default) and vega-production (Vega OS
# VPKG artifact) through the Codemagic API with the same tag and versionCode.
# Those also read CODEMAGIC_API_TOKEN, AMAZON_CLIENT_ID, AMAZON_CLIENT_SECRET,
# HORIZON_APP_ID and HORIZON_APP_SECRET from `martie_production`. None of them
# submits for review unless started by hand with that input turned on.
#
# Every workflow runs on mac_mini_m2: the OpenIAP team plan offers no Linux
# instance, and the Mac image carries the Android SDK as well.
# Over-the-air updates ship from an `ota-*` tag (ota-production, Codemagic Patch).

definitions:
  environment: &environment
    node: 22.14.0
    vars:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      STAGE: development
      BUN_VERSION: '1.3.13'
  # Pull requests only: the team runs one build at a time, and a check on every
  # push to main would queue ahead of release builds (which build natively too).
  triggering: &triggering
    events:
      - pull_request
    branch_patterns:
      - pattern: main
        include: true
        source: false
    cancel_previous_builds: true
  scripts:
    - &install_bun
      name: Install Bun
      script: |
        curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
        echo "PATH=$HOME/.bun/bin:$PATH" >> "$CM_ENV"
    - &install_dependencies
      name: Install dependencies
      script: bun install --frozen-lockfile
    - &check_expo_token
      name: Check the EAS access
      script: |
        set -euo pipefail
        test -n "${EXPO_TOKEN:-}" || { echo "EXPO_TOKEN is missing from martie_production"; exit 1; }
        bunx eas-cli@23.0.0 whoami
    - &firebase_from_eas
      name: Write the Firebase config from EAS
      script: |
        set -euo pipefail
        # The real files are not in the repository; the EAS production
        # environment keeps them base64-encoded.
        bunx eas-cli@23.0.0 env:exec production --non-interactive \
          'printenv GOOGLE_SERVICES_JSON_BASE64 | base64 --decode > google-services.json &&
           printenv GOOGLE_SERVICE_INFO_PLIST_BASE64 | base64 --decode > GoogleService-Info.plist'
        test -s google-services.json
        test -s GoogleService-Info.plist
    # Fire OS and Horizon ship the versionCode android-production uploaded to
    # Play: their EAS profiles read the remote code without bumping it.
    - &check_version_code
      name: Check the versionCode
      script: |
        set -euo pipefail
        code=$(bunx eas-cli@23.0.0 build:version:get --platform android \
          --profile production --json --non-interactive | node -e \
          'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).versionCode))')
        wanted='${{ inputs.version_code }}'
        if [[ "$wanted" != 0 && "$wanted" != "$code" ]]; then
          echo "EAS remote versionCode is $code, not $wanted; rerun with the current code"
          exit 1
        fi
        echo "VERSION_CODE=$code" >> "$CM_ENV"
        echo "Building versionCode $code"
    # The tag message (the GitHub Release note), or the commit subject.
    - &release_notes
      name: Write the release notes
      script: |
        set -euo pipefail
        git fetch --quiet --tags origin
        notes=""
        [[ -n "${CM_TAG:-}" ]] && notes=$(git tag -l --format='%(contents)' "$CM_TAG")
        [[ -n "$notes" ]] || notes=$(git log -1 --format=%s)
        mkdir -p build
        printf '%s\n' "$notes" > build/release-notes.txt
        cat build/release-notes.txt
    - &check_release_tag
      name: Check the tag matches the app version
      script: |
        set -euo pipefail
        version=$(node -p 'require("./package.json").version')
        if [[ -n "${CM_TAG:-}" && "$CM_TAG" != "v$version" ]]; then
          echo "Tag $CM_TAG does not match package.json version $version"
          exit 1
        fi
        echo "Building $version"
    - &placeholder_firebase
      name: Write placeholder Firebase config
      script: |
        cat > GoogleService-Info.plist <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>API_KEY</key><string>placeholder</string>
          <key>BUNDLE_ID</key><string>dev.hyo.martie</string>
          <key>GCM_SENDER_ID</key><string>000000000000</string>
          <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          <key>PROJECT_ID</key><string>placeholder</string>
          <key>STORAGE_BUCKET</key><string>placeholder.appspot.com</string>
        </dict>
        </plist>
        PLIST
        cat > google-services.json <<'JSON'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "placeholder",
            "storage_bucket": "placeholder.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {"package_name": "dev.hyo.martie"}
              },
              "api_key": [{"current_key": "placeholder"}]
            }
          ],
          "configuration_version": "1"
        }
        JSON

  # Store builds start from a pushed `v<version>` tag (or by hand).
  release_triggering: &release_triggering
    events:
      - tag
    tag_patterns:
      - pattern: 'v*'
        include: true
  # YAML merge keys are shallow: each production workflow lists its own `vars`.
  production_environment: &production_environment
    node: 22.14.0
    groups:
      - martie_production

workflows:
  ios-simulator:
    name: iOS simulator build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *environment
      xcode: latest
      cocoapods: default
    triggering: *triggering
    scripts:
      - *install_bun
      - *install_dependencies
      - *placeholder_firebase
      - name: Generate the iOS project
        script: bunx expo prebuild --no-install --platform ios
      - name: Install pods
        script: cd ios && pod install
      - name: Build for the iOS simulator
        script: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Martie.xcworkspace \
            -scheme Martie \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty
    artifacts:
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app

  android-release:
    name: Android release build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *environment
      java: 17
    triggering: *triggering
    scripts:
      - *install_bun
      - *install_dependencies
      - *placeholder_firebase
      - name: Generate the Android project
        script: bunx expo prebuild --no-install --platform android
      - name: Build the release APK
        script: cd android && ./gradlew :app:assembleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-production:
    name: iOS production (TestFlight upload)
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering: *release_triggering
    environment:
      <<: *production_environment
      vars:
        CI: '1'
        EXPO_NO_DOTENV: '1'
        STAGE: production
        BUN_VERSION: '1.3.13'
      xcode: latest
      cocoapods: default
    scripts:
      - *install_bun
      - *install_dependencies
      - *check_release_tag
      - *check_expo_token
      - *firebase_from_eas
      - name: Build the signed IPA with EAS credentials
        script: |
          set -euo pipefail
          bunx eas-cli@23.0.0 build --platform ios --profile production \
            --local --non-interactive --output build/martie.ipa
      - name: Check the bundle carries the production backend
        script: |
          set -euo pipefail
          # grep -c reads to the end; grep -q would close the pipe early and
          # pipefail would turn the writer's SIGPIPE (141) into a failure.
          unzip -p build/martie.ipa 'Payload/*.app/main.jsbundle' \
            | grep -a -c martie-server.hyo.dev > /dev/null
          echo "main.jsbundle targets martie-server.hyo.dev"
      - name: Upload to TestFlight
        script: |
          bunx eas-cli@23.0.0 submit --platform ios --profile codemagic \
            --path build/martie.ipa --non-interactive
    artifacts:
      - build/*.ipa

  android-production:
    name: Android production (Play internal draft)
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering: *release_triggering
    environment:
      <<: *production_environment
      vars:
        CI: '1'
        EXPO_NO_DOTENV: '1'
        STAGE: production
        BUN_VERSION: '1.3.13'
        # Public SHA-256 of the Play upload certificate (EAS keystore). A
        # release signed with any other key fails here instead of at Play.
        UPLOAD_CERT_SHA256: '2B:56:EA:9E:00:25:2E:28:13:4C:51:0B:D6:1B:8F:D0:A9:1F:67:C9:2E:2C:79:C9:EE:6D:CB:CF:A8:28:EE:9F'
      java: 17
    scripts:
      - *install_bun
      - *install_dependencies
      - *check_release_tag
      - *check_expo_token
      - name: Check the Codemagic API access
        script: |
          set -euo pipefail
          # The last step starts the Fire OS, Horizon and Vega builds; a bad
          # token should fail here, before anything reaches Play.
          test -n "${CODEMAGIC_API_TOKEN:-}" || { echo "CODEMAGIC_API_TOKEN is missing from martie_production"; exit 1; }
          curl -fsS -o /dev/null -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
            "https://codemagic.io/api/v3/apps/$CM_PROJECT_ID/workflows"
          echo "Codemagic API access works"
      - *firebase_from_eas
      - name: Build the signed app bundle with EAS credentials
        script: |
          set -euo pipefail
          bunx eas-cli@23.0.0 build --platform android --profile production \
            --local --non-interactive --output build/martie.aab
      - name: Check the signature and the production backend
        script: |
          set -euo pipefail
          aab=build/martie.aab
          # grep -c reads to the end; grep -q would close the pipe early and
          # pipefail would turn the writer's SIGPIPE (141) into a failure.
          keytool -printcert -jarfile "$aab" | grep -c "SHA256: $UPLOAD_CERT_SHA256" > /dev/null
          unzip -p "$aab" base/assets/index.android.bundle \
            | grep -a -c martie-server.hyo.dev > /dev/null
          echo "Signed with the upload key; bundle targets martie-server.hyo.dev"
      - name: Upload to the Play internal track as a draft
        script: |
          bunx eas-cli@23.0.0 submit --platform android --profile codemagic \
            --path build/martie.aab --non-interactive
      - name: Start the Fire OS, Horizon and Vega builds with this versionCode
        script: |
          set -euo pipefail
          # They reuse the EAS remote versionCode this build just took, so the
          # Android stores ship the same code and Vega uses it as its build
          # number. Starting them here, not from the tag, keeps them from
          # reading the code before the bump.
          test -n "${CODEMAGIC_API_TOKEN:-}" || { echo "CODEMAGIC_API_TOKEN is missing from martie_production"; exit 1; }
          code=$(bunx eas-cli@23.0.0 build:version:get --platform android \
            --profile production --json --non-interactive | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).versionCode))')
          if [[ -n "${CM_TAG:-}" ]]; then ref=$(jq -n --arg t "$CM_TAG" '{tag: $t}')
          else ref=$(jq -n --arg b "$CM_BRANCH" '{branch: $b}'); fi
          for workflow in amazon-production horizon-production vega-production; do
            jq -n --arg w "$workflow" --argjson c "$code" --argjson ref "$ref" \
              '$ref + {workflow_id: $w, inputs: {version_code: $c}}' \
              | curl -fsS -X POST "https://codemagic.io/api/v3/apps/$CM_PROJECT_ID/builds" \
                  -H "x-auth-token: $CODEMAGIC_API_TOKEN" -H 'Content-Type: application/json' \
                  --data-binary @- > /dev/null
            echo "Started $workflow with versionCode $code"
          done
    artifacts:
      - build/*.aab

  # Amazon Appstore (Fire tablets). android-production starts it with the
  # versionCode it uploaded to Play; a manual run takes the current EAS remote
  # code (version_code 0) or checks a given one. The App Submission API takes
  # APKs only, so this builds a universal armeabi-v7a + arm64 APK. The script
  # replaces the binary in the open edit (keeping its device targeting), sets
  # the release notes and validates; the edit is committed (sent to review)
  # only with `submit` on.
  amazon-production:
    name: Fire OS production (Amazon Appstore edit)
    instance_type: mac_mini_m2
    max_build_duration: 120
    inputs:
      version_code:
        description: Android versionCode to ship (0 = current EAS remote code)
        type: number
        default: 0
      upload:
        description: Upload to Amazon (off builds and checks the APK only)
        type: boolean
        default: true
      submit:
        description: Commit the edit, sending it to Amazon review
        type: boolean
        default: false
    environment:
      <<: *production_environment
      vars:
        CI: '1'
        EXPO_NO_DOTENV: '1'
        STAGE: production
        BUN_VERSION: '1.3.13'
        # SHA-256 of the EAS upload certificate, as apksigner prints it.
        UPLOAD_CERT_SHA256: '2b56ea9e00252e28134c510bd61b8fd0a91f67c92e2c79c9ee6dcbcfa828ee9f'
      java: 17
    scripts:
      - *install_bun
      - *install_dependencies
      - *check_release_tag
      - *check_expo_token
      - *check_version_code
      - *firebase_from_eas
      # Read-only: proves the credentials and shows the edit the upload
      # would change, before the long build. Runs with upload off too.
      - name: Check the Amazon access
        script: |
          set -euo pipefail
          node scripts/stores/amazon-appstore.mjs check
          node scripts/stores/amazon-appstore.mjs plan
      - name: Build the signed APK with EAS credentials
        script: |
          set -euo pipefail
          bunx eas-cli@23.0.0 build --platform android --profile amazon-codemagic \
            --local --non-interactive --output build/martie-amazon.apk
      - name: Check the signature, manifest and production backend
        script: |
          set -euo pipefail
          apk=build/martie-amazon.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$tools/apksigner" verify --print-certs "$apk" \
            | grep -c "SHA-256 digest: $UPLOAD_CERT_SHA256" > /dev/null
          badging=$("$tools/aapt2" dump badging "$apk")
          grep -c "versionCode='$VERSION_CODE'" <<< "$badging" > /dev/null \
            || { echo "APK versionCode is not $VERSION_CODE"; exit 1; }
          grep -c "native-code: 'arm64-v8a' 'armeabi-v7a'$" <<< "$badging" > /dev/null \
            || { echo "Fire OS APK must hold armeabi-v7a and arm64-v8a"; exit 1; }
          unzip -p "$apk" assets/index.android.bundle \
            | grep -a -c martie-server.hyo.dev > /dev/null
          echo "Signed with the upload key; versionCode $VERSION_CODE; bundle targets martie-server.hyo.dev"
      - *release_notes
      - name: Upload to the Amazon Appstore edit
        script: |
          set -euo pipefail
          [[ '${{ inputs.upload }}' == [Tt]rue ]] || { echo "Upload is off"; exit 0; }
          args=(upload --file build/martie-amazon.apk --notes-file build/release-notes.txt)
          [[ '${{ inputs.submit }}' == [Tt]rue ]] && args+=(--submit)
          node scripts/stores/amazon-appstore.mjs "${args[@]}"
    artifacts:
      - build/*.apk

  # Meta Horizon Store (Quest). Started like amazon-production. `release`
  # picks the channel: `draft` uploads to the store channel without releasing
  # it (publish it from the dashboard), `alpha` goes to the ALPHA test
  # channel, and `live` releases it to every user at once: Meta reviews the
  # first submission only, and later store-channel uploads go live with no
  # review, so `live` needs the same go-ahead as a store submission.
  horizon-production:
    name: Horizon production (Meta Horizon Store upload)
    instance_type: mac_mini_m2
    max_build_duration: 120
    inputs:
      version_code:
        description: Android versionCode to ship (0 = current EAS remote code)
        type: number
        default: 0
      upload:
        description: Upload to Meta (off builds and checks the APK only)
        type: boolean
        default: true
      release:
        description: draft (store channel, unreleased), alpha (ALPHA channel) or live
        type: choice
        options:
          - draft
          - alpha
          - live
        default: draft
    environment:
      <<: *production_environment
      vars:
        CI: '1'
        EXPO_NO_DOTENV: '1'
        STAGE: production
        BUN_VERSION: '1.3.13'
        # SHA-256 of the same EAS upload certificate, as apksigner prints it.
        UPLOAD_CERT_SHA256: '2b56ea9e00252e28134c510bd61b8fd0a91f67c92e2c79c9ee6dcbcfa828ee9f'
      java: 17
    scripts:
      - *install_bun
      - *install_dependencies
      - *check_release_tag
      - *check_expo_token
      - *check_version_code
      - *firebase_from_eas
      - name: Install the Meta Platform Utility
        script: |
          set -euo pipefail
          # The build needs the app id; only the upload needs the secret.
          test -n "${HORIZON_APP_ID:-}" || { echo "HORIZON_APP_ID is missing from martie_production"; exit 1; }
          mkdir -p "$HOME/bin"
          # Meta's macOS download of ovr-platform-util (universal binary).
          curl -fsSL -o "$HOME/bin/ovr-platform-util" \
            'https://www.oculus.com/download_app/?id=1462426033810370'
          chmod +x "$HOME/bin/ovr-platform-util"
          echo "PATH=$HOME/bin:$PATH" >> "$CM_ENV"
          "$HOME/bin/ovr-platform-util" version
      - name: Build the signed APK with EAS credentials
        script: |
          set -euo pipefail
          # app.config.ts reads HORIZON_APP_ID for the Horizon platform SDK.
          bunx eas-cli@23.0.0 build --platform android --profile horizon-codemagic \
            --local --non-interactive --output build/martie-horizon.apk
      - name: Check the signature, manifest and production backend
        script: |
          set -euo pipefail
          apk=build/martie-horizon.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$tools/apksigner" verify --print-certs "$apk" \
            | grep -c "SHA-256 digest: $UPLOAD_CERT_SHA256" > /dev/null
          badging=$("$tools/aapt2" dump badging "$apk")
          grep -c "versionCode='$VERSION_CODE'" <<< "$badging" > /dev/null \
            || { echo "APK versionCode is not $VERSION_CODE"; exit 1; }
          grep -c "targetSdkVersion:'34'" <<< "$badging" > /dev/null \
            || { echo "Horizon needs targetSdkVersion 34"; exit 1; }
          if grep -c "READ_PHONE_STATE" <<< "$badging" > /dev/null; then
            echo "READ_PHONE_STATE is in the manifest; Meta rejects it"; exit 1
          fi
          grep -c "native-code: 'arm64-v8a'$" <<< "$badging" > /dev/null \
            || { echo "Horizon APK must hold arm64-v8a only"; exit 1; }
          unzip -p "$apk" assets/index.android.bundle \
            | grep -a -c martie-server.hyo.dev > /dev/null
          echo "Signed with the upload key; versionCode $VERSION_CODE; targetSdk 34; bundle targets martie-server.hyo.dev"
      - *release_notes
      - name: Upload to the Horizon Store
        script: |
          set -euo pipefail
          [[ '${{ inputs.upload }}' == [Tt]rue ]] || { echo "Upload is off"; exit 0; }
          test -n "${HORIZON_APP_SECRET:-}" || { echo "HORIZON_APP_SECRET is missing from martie_production"; exit 1; }
          release='${{ inputs.release }}'
          case "$release" in
            draft) args=(--channel store --draft) ;;
            alpha) args=(--channel ALPHA) ;;
            live) args=(--channel store) ;;
            *) echo "Unknown release $release"; exit 1 ;;
          esac
          ovr-platform-util upload-quest-build \
            --app-id "$HORIZON_APP_ID" --app-secret "$HORIZON_APP_SECRET" \
            --apk build/martie-horizon.apk --age-group TEENS_AND_ADULTS \
            --notes "$(cat build/release-notes.txt)" "${args[@]}"
    artifacts:
      - build/*.apk

  # Amazon Vega OS (Fire TV). Started like amazon-production; the versionCode
  # becomes the VPKG build number and package.json the version. The App
  # Submission API takes Android APKs only, so the VPKG stops here as an
  # artifact: add it to the Vega OS release track in the Developer Console.
  vega-production:
    name: Vega production (VPKG for the Amazon Appstore)
    instance_type: mac_mini_m2
    max_build_duration: 60
    inputs:
      version_code:
        description: Build number (0 = current EAS remote Android versionCode)
        type: number
        default: 0
    environment:
      <<: *production_environment
      vars:
        CI: '1'
        BUN_VERSION: '1.3.13'
        VEGA_SDK_VERSION: '0.22.6759'
    scripts:
      - *install_bun
      # eas-cli reads app.config.ts for the versionCode.
      - *install_dependencies
      - *check_release_tag
      - *check_expo_token
      - *check_version_code
      - name: Install the Vega SDK
        script: |
          set -euo pipefail
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh \
            | NONINTERACTIVE=true bash
          source "$HOME/vega/env"
          echo "PATH=$PATH" >> "$CM_ENV"
          echo "KEPLER_SDK_PATH=$KEPLER_SDK_PATH" >> "$CM_ENV"
          vega --version
      - name: Build the release VPKG
        script: |
          set -euo pipefail
          VEGA_BUILD_NUMBER="$VERSION_CODE" bash scripts/build-vega.sh | tee build-vega.log
          version=$(node -p 'require("./package.json").version')
          grep -c "\"version\": \"$version\"" build-vega.log > /dev/null
          grep -c "\"build_number\": $VERSION_CODE" build-vega.log > /dev/null
          ls -l apps/vega/build/armv7-release/vega_armv7.vpkg
          echo "Upload apps/vega/build/armv7-release/vega_armv7.vpkg ($version, build $VERSION_CODE) in the Developer Console"
    artifacts:
      - apps/vega/build/armv7-release/*.vpkg
      - apps/vega/build/aarch64-release/*.vpkg

  # Publishes a Codemagic Patch OTA to the Production deployment from a pushed
  # `ota-*` tag on a main commit. The tag message (or the commit subject) is
  # the release note. `cmpatch release-react` refuses a bundle whose native
  # fingerprint differs from the store binary, so native changes cannot ship
  # this way.
  ota-production:
    name: OTA production (Codemagic Patch)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      <<: *production_environment
      vars:
        CI: '1'
        EXPO_NO_DOTENV: '1'
        BUN_VERSION: '1.3.13'
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ota-*'
          include: true
    scripts:
      - *install_bun
      - *install_dependencies
      - *check_expo_token
      - *firebase_from_eas
      - name: Check the Patch access
        script: |
          set -euo pipefail
          test -n "${CODEMAGIC_PATCH_TOKEN:-}" || { echo "CODEMAGIC_PATCH_TOKEN is missing from martie_production"; exit 1; }
          bunx @codemagic/patch-cli@0.10.0 whoami --server-url https://ota.codemagicpatch.dev > /dev/null
          echo "Patch login works"
      - name: Publish the OTA update
        script: |
          set -euo pipefail
          git fetch --quiet --tags origin
          message=$(git tag -l --format='%(contents:subject)' "${CM_TAG:-}")
          [[ -n "$message" ]] || message=$(git log -1 --format=%s)
          OTA_CONFIRM_COMPATIBLE=1 OTA_MESSAGE="$message" scripts/ota-release.zsh all
