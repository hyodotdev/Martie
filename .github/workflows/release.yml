name: Release

# Starts a Codemagic release from GitHub. It only creates a tag on the current
# main commit after that commit's CI passed; Codemagic's webhook does the rest
# (codemagic.yaml):
#   store -> tag v<package.json version> + GitHub Release
#            -> ios-production and android-production (TestFlight, Play draft)
#   ota   -> annotated tag ota-<version>-<n> -> ota-production (Codemagic Patch)
# Publishing a GitHub Release for a new v<version> tag by hand starts the same
# store builds.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: What to release
        type: choice
        options:
          - ota
          - store
        required: true
      message:
        description: Release note (shown for the OTA and the GitHub Release)
        type: string
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: ${{ github.repository == 'hyodotdev/Martie' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI \
            --commit "$GITHUB_SHA" --event push --limit 1 \
            --json status,conclusion \
            --jq 'if length == 1 then "\(.[0].status):\(.[0].conclusion)" else "" end')
          if [ "$state" != "completed:success" ]; then
            echo "::error::CI for $GITHUB_SHA is '${state:-missing}'; release only a green main commit."
            exit 1
          fi

      - name: Create and push the release tag
        env:
          KIND: ${{ inputs.kind }}
          MESSAGE: ${{ inputs.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$KIND" = store ]; then
            tag="v$version"
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::$tag already exists; bump the version in package.json first."
              exit 1
            fi
          else
            # The first OTA of a version has no tag to match; grep exits 1
            # there, which pipefail would turn into a failed release.
            last=$(git tag -l "ota-$version-*" | sed "s/^ota-$version-//" | { grep -E '^[0-9]+$' || true; } | sort -n | tail -1)
            tag="ota-$version-$(( ${last:-0} + 1 ))"
          fi
          git tag -a "$tag" -m "$MESSAGE"
          git push origin "$tag"
          if [ "$KIND" = store ]; then
            gh release create "$tag" --verify-tag --title "$tag" --notes "$MESSAGE"
          fi
          {
            echo "### Tagged \`$tag\` on \`${GITHUB_SHA::7}\`"
            echo "Codemagic picks it up: https://codemagic.io/builds"
          } >> "$GITHUB_STEP_SUMMARY"
